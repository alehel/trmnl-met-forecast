---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
polling_url: https://api.met.no/weatherapi/locationforecast/2.0/complete.json?lat={{ latitude }}&lon={{ longitude }}
polling_headers: user-agent=TRMNL
polling_body: ''
id: 132448
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  description: Weather forecast from The Norwegian Meteorological Institute (met.no) for the TRMNL X full-screen layout. Shows current conditions with UV index and sunscreen window, today hour by hour, tomorrow in 2-hour steps, and 6-hour blocks for the days after. This is not an official plugin. Based on the met.no plugin by Argo Roots.
  github_url: https://github.com/alehel/trmnl-met-forecast
  learn_more_url: https://www.met.no
- keyname: latitude
  name: Latitude
  description: Latitude coordinate for the weather location (e.g., 59.9139).
  field_type: string
  rows: 1
  placeholder: '59.9139'
  required: true
- keyname: longitude
  name: Longitude
  description: Longitude coordinate for the weather location (e.g., 10.7522).
  field_type: string
  rows: 1
  placeholder: '10.7522'
  required: true
- keyname: language
  name: Language
  description: Language for weather forecast and day names.
  field_type: select
  options:
  - English: en
  - Norsk: 'no'
  default: en
  optional: false
name: Met.no Forecast
refresh_interval: 15
